<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- The Stellar type (Terastal, gen 9): our own drawing, in partywhale/pokemon-type-icons' style; the
       games draw it as a many-coloured star. -->
  <defs>
    <linearGradient id="stellar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4613e"/>
      <stop offset="0.35" stop-color="#dfbc28"/>
      <stop offset="0.65" stop-color="#40b5a5"/>
      <stop offset="1" stop-color="#576fbc"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="128" fill="url(#stellar)"/>
  <polygon fill="#fff" points="128.0,40.0 149.2,106.8 216.0,128.0 149.2,149.2 128.0,216.0 106.8,149.2 40.0,128.0 106.8,106.8"/>
</svg>

name: pkmnteambuilder

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    ports:
      - "3001:3001"
    # BETTER_AUTH_SECRET and BETTER_AUTH_URL (the public URL, https in production) come from
    # apps/web/.env; see apps/web/.env.example.
    env_file:
      - path: apps/web/.env
        required: true
    environment:
      # Inside the container the database is always the volume below, whatever .env says.
      DATABASE_URL: file:/data/local.db
    volumes:
      # Named volume: survives rebuilds and `docker compose down` (not `down -v`). Back it up with
      # `docker compose cp web:/data/local.db ./backup.db`.
      - db-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env

volumes:
  db-data:
